<!doctype html><meta charset="utf-8"><title>OmniBrowser Web</title>
<script>
  // GitHub Pages: 사용자 사이트(아이디.github.io)는 /, 저장소 사이트는 /저장소이름/ 이 시작 주소
  var p = location.pathname.split('/').filter(Boolean)
  var root = /\.github\.io$/.test(location.hostname) && p.length && !/\.github\.io$/i.test(p[0]) ? '/' + p[0] + '/' : '/'
  location.replace(root + '#/')
</script>
<p>페이지를 찾을 수 없습니다. <a href="/">처음 화면으로</a></p>
